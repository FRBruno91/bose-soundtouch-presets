              - color: '[[[ const member = ''this.entity_id''; const master = states[''input_text.bose_enceinte''] && states[''input_text.bose_enceinte''].state; const gm = (master && states[master] && states[master].attributes.group_members) || []; const om = (states[member] && states[member].attributes.group_members) || []; const on = !!(master && states[master] && master !== member && (gm.includes(member) || om.includes(master))); return on ? ''#f7f7f7'' : ''#9a9a9a''; ]]]'
              - font-size: 15px
            visibility:
            - condition: template
              value_template: '{% set ns = namespace(rows=[], players=[]) %}{% for e in integration_entities(''soundtouchplus'') if e.startswith(''media_player.'') %}{% set ns.rows = ns.rows + [(state_attr(e, ''friendly_name'') | default(e) | lower) ~ ''||'' ~ e] %}{% endfor %}{% for row in ns.rows | sort %}{% set ns.players = ns.players + [row.split(''||'')[1]] %}{% endfor %}{% set picked = states(''input_text.bose_enceinte'') %}{% set master = picked if picked in ns.players else (ns.players | first | default('''')) %}{{ ''this.entity_id'' != master }}'
