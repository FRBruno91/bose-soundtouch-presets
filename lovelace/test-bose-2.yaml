    - type: markdown
      content: |-
        {% set ns = namespace(rows=[], players=[]) %}
        {% for e in integration_entities('soundtouchplus') if e.startswith('media_player.') %}
        {% set ns.rows = ns.rows + [(state_attr(e, 'friendly_name') | default(e) | lower) ~ '||' ~ e] %}
        {% endfor %}
        {% for row in ns.rows | sort %}
        {% set ns.players = ns.players + [row.split('||')[1]] %}
        {% endfor %}
        {% set picked = states('input_text.bose_enceinte') %}
        {% set cible = picked if picked in ns.players else (ns.players | first | default('')) %}
        {% set title = state_attr(cible, 'media_title') or state_attr(cible, 'source') %}
        {% set quiet = states(cible) in ['off', 'idle', 'standby', 'unavailable', 'unknown', 'none'] or not title %}
        <div style="text-align:center;margin-top:18px;">
        <div style="color:#f5f5f5;font-weight:300;font-size:22px;letter-spacing:0.06em;">{{ state_attr(cible, 'friendly_name') | default(cible) }}</div>
        <div style="color:#9a9a9a;font-weight:300;font-size:14px;letter-spacing:0.04em;margin-top:8px;">{{ 'Arrêt' if quiet else title }}</div>
        {% set mode = states('input_text.bose_ecoute') %}
        {% if not quiet and mode == 'http' %}
        <div style="margin-top:8px;"><span style="color:#1f9d55;font-weight:600;letter-spacing:0.12em;">http</span></div>
        {% elif not quiet and mode == 'https' %}
        <div style="margin-top:8px;"><span style="color:#e23b3b;font-weight:600;letter-spacing:0.12em;">https</span></div>
        {% endif %}
        </div>
