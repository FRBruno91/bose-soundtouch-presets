            ha-card { background: transparent; box-shadow: none; border: none; }
            #root { gap: 6px 12px !important; }
      card_param: cards
      show_empty: false
      sort:
        method: friendly_name
        ignore_case: true
      filter:
        include:
        - domain: media_player
          integration: soundtouchplus
          options:
            type: custom:button-card
            entity: this.entity_id
            name: '[[[ const st = states[''this.entity_id'']; return (st && st.attributes.friendly_name) || ''this.entity_id''; ]]]'
            show_icon: false
            show_state: false
            triggers_update: all
            hold_action:
              action: none
            tap_action:
              action: call-service
              service: input_text.set_value
              service_data:
                entity_id: input_text.bose_enceinte
                value: this.entity_id
            styles:
              card:
              - background: transparent
              - border: none
              - box-shadow: none
              - height: auto
              - min-height: 48px
              - padding: 12px 4px
              - overflow: visible
              - cursor: pointer
              name:
              - white-space: normal
              - overflow: visible
              - text-overflow: unset
              - text-align: left
              - line-height: "1.35"
              - width: 100%
              - word-break: break-word
              - font-weight: "300"
              - letter-spacing: 0.01em
              - color: '[[[ const sel = states[''input_text.bose_enceinte''] && states[''input_text.bose_enceinte''].state; return sel === ''this.entity_id'' ? ''#f7f7f7'' : ''#9a9a9a''; ]]]'
              - font-size: '[[[ const sel = states[''input_text.bose_enceinte''] && states[''input_text.bose_enceinte''].state; return sel === ''this.entity_id'' ? ''17px'' : ''15px''; ]]]'
              - text-decoration: '[[[ const sel = states[''input_text.bose_enceinte''] && states[''input_text.bose_enceinte''].state; return sel === ''this.entity_id'' ? ''underline'' : ''none''; ]]]'
              - text-underline-offset: 4px
            show_label: false
      else:
        type: markdown
        content: Aucune enceinte SoundTouch Plus.
        card_mod:
          style: |2

            ha-card { background: transparent; box-shadow: none; border: none; }
