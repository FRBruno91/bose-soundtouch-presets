# Package Home Assistant pour les présélections Bose SoundTouch.
# Copier ce fichier dans /config/packages/bose_soundtouch_presets.yaml
# Voir le README pour activer les packages.
#
# input_text.bose_enceinte reste vide : la vue y enregistre l'identifiant
# de l'enceinte SoundTouch Plus choisie. N'y mettez pas d'adresse IP.
# Certaines stations d'exemple (flux http publics) sont préremplies.
# Les anciens helpers bose_1_* à bose_6_* et la liste bose_cible ne font
# pas partie de cette vue.

shell_command:
  bose_radio_search: 'python3 /config/bose_radio_search.py "{{ q }}"'
  bose_relay_prepare: 'python3 /config/bose_https_relay.py --register "{{ url }}"'

