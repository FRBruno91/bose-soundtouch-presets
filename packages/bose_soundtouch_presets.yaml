  bose_assigner:
    alias: Bose assigner une touche
    icon: mdi:numeric
    mode: queued
    fields:
      slot:
        name: Slot
        required: true
        selector:
          text: {}
      touche:
        name: Touche
        required: true
        selector:
          text: {}
    sequence:
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ (touche | int(0)) in [1,2,3,4,5,6] and  (slot | int(0))
            >= 1 and (slot | int(0)) <= 12 and (states(''input_text.bose_lib_'' ~ (''%02d''
            % (slot | int(0))) ~ ''_url'') | trim).lower().startswith(''http'') and ''.m3u8''
            not in (states(''input_text.bose_lib_'' ~ (''%02d'' % (slot | int(0))) ~
            ''_url'') | lower) and (states(''input_text.bose_lib_'' ~ (''%02d'' % (slot
            | int(0))) ~ ''_nom'') | trim) not in ['''', ''unknown'', ''unavailable'',
            ''none''] }}'
        sequence:
        - variables:
            previous: '{{ states(''input_text.bose_touche_'' ~ (touche | int)) | trim
              }}'
        - repeat:
            for_each:
            - '1'
            - '2'
            - '3'
            - '4'
            - '5'
            - '6'
            sequence:
            - if:
              - condition: template
                value_template: '{{ states(''input_text.bose_touche_'' ~ repeat.item)
                  == (slot | string) and (repeat.item | string) != (touche | string)
                  }}'
              then:
              - action: input_text.set_value
                target:
                  entity_id: '{{ ''input_text.bose_touche_'' ~ repeat.item }}'
                data:
                  value: ''
        - action: input_text.set_value
          target:
            entity_id: '{{ ''input_text.bose_touche_'' ~ (touche | int) }}'
          data:
            value: '{{ slot | string }}'
        - action: input_text.set_value
          target:
            entity_id: input_text.bose_presel_message
          data:
            value: ''
        - action: input_text.set_value
          target:
            entity_id: input_text.bose_attente
          data:
            value: '{% set ns = namespace(items=[]) %}{% for part in states(''input_text.bose_attente'').split('','')
              %}{% if (part | trim) not in ['''', ''unknown'', ''unavailable'', ''none'']
              and not ((part | trim) == (slot | string) or (part | trim) == (previous))
              %}{% set ns.items = ns.items + [part | trim] %}{% endif %}{% endfor %}{{
              ns.items | join('','') }}'
      default:
      - action: input_text.set_value
        target:
          entity_id: input_text.bose_presel_message
        data:
          value: Cette station ne peut pas être assignée.
