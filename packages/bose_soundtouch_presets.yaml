  bose_ajouter_resultat:
    alias: Bose ajouter un résultat
    icon: mdi:playlist-plus
    mode: queued
    fields:
      slot:
        name: Slot
        required: true
        selector:
          text: {}
    sequence:
    - variables:
        nom: '{{ states(''input_text.bose_res_'' ~ (''%02d'' % (slot | int(0))) ~ ''_nom'')
          | trim }}'
        url: '{{ states(''input_text.bose_res_'' ~ (''%02d'' % (slot | int(0))) ~ ''_url'')
          | trim }}'
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ not ((slot | int(0)) >= 1 and (slot | int(0)) <= 8 and
            states(''input_text.bose_res_'' ~ (''%02d'' % (slot | int(0))) ~ ''_ok'')
            == ''1'' and (states(''input_text.bose_res_'' ~ (''%02d'' % (slot | int(0)))
            ~ ''_url'') | trim).lower().startswith(''http'') and ''.m3u8'' not in (states(''input_text.bose_res_''
            ~ (''%02d'' % (slot | int(0))) ~ ''_url'') | lower) and (states(''input_text.bose_res_''
            ~ (''%02d'' % (slot | int(0))) ~ ''_nom'') | trim) not in ['''', ''unknown'',
            ''unavailable'', ''none'']) }}'
        sequence:
        - action: input_text.set_value
          target:
            entity_id: input_text.bose_presel_message
          data:
            value: Ce flux n'est pas en http://.
      default:
      - variables:
          free: '{% set ns = namespace(empty=0, reuse=0) %}{% set pending = states(''input_text.bose_attente'').split('','')
            | map(''trim'') | list %}{% for i in range(1, 13) %}{% set nom = states(''input_text.bose_lib_''
            ~ (''%02d'' % i) ~ ''_nom'') | trim %}{% set blank = nom in ['''', ''unknown'',
            ''unavailable'', ''none''] %}{% set nsk = namespace(on=false) %}{% for k
            in [1,2,3,4,5,6] %}{% if states(''input_text.bose_touche_'' ~ k) | trim
            == (i | string) %}{% set nsk.on = true %}{% endif %}{% endfor %}{% if blank
            and ns.empty == 0 %}{% set ns.empty = i %}{% elif (not blank) and (not nsk.on)
            and ((i | string) not in pending) and ns.reuse == 0 %}{% set ns.reuse =
            i %}{% endif %}{% endfor %}{{ ns.empty if ns.empty else ns.reuse }}'
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ free | int(0) == 0 }}'
          sequence:
          - action: input_text.set_value
            target:
              entity_id: input_text.bose_presel_message
            data:
              value: 'Bibliothèque pleine : 12 stations.'
        default:
        - action: input_text.set_value
          target:
            entity_id: '{{ ''input_text.bose_lib_'' ~ (''%02d'' % (free | int)) ~ ''_nom''
              }}'
          data:
            value: '{{ nom }}'
        - action: input_text.set_value
          target:
            entity_id: '{{ ''input_text.bose_lib_'' ~ (''%02d'' % (free | int)) ~ ''_url''
              }}'
          data:
            value: '{{ url }}'
        - action: input_text.set_value
          target:
            entity_id: input_text.bose_presel_message
          data:
            value: ''
        - action: input_text.set_value
          target:
            entity_id: input_text.bose_attente
          data:
            value: '{% set ns = namespace(items=[]) %}{% for part in states(''input_text.bose_attente'').split('','')
              %}{% if (part | trim) not in ['''', ''unknown'', ''unavailable'', ''none'']
              %}{% set ns.items = ns.items + [part | trim] %}{% endif %}{% endfor %}{%
