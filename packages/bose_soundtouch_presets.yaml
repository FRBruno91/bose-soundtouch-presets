script:
  bose_jouer_1:
    alias: Bose jouer preset 1
    icon: mdi:radio
    mode: restart
    sequence:
    - variables:
        cible: "{% set ns = namespace(rows=[], players=[]) %}\n{% for e in integration_entities('soundtouchplus')
          if e.startswith('media_player.') %}\n  {% set ns.rows = ns.rows + [(state_attr(e,
          'friendly_name') | default(e) | lower) ~ '||' ~ e] %}\n{% endfor %}\n{% for
          row in ns.rows | sort %}\n  {% set ns.players = ns.players + [row.split('||')[1]]
          %}\n{% endfor %}\n{% set picked = states('input_text.bose_enceinte') %}\n{{
          picked if picked in ns.players else (ns.players | first | default('')) }}"
        url: '{{ states(''input_text.bose_lib_'' ~ (''%02d'' % (states(''input_text.bose_touche_1'')
          | int(0))) ~ ''_url'') if (states(''input_text.bose_touche_1'') | int(0))
          > 0 else '''' }}'
        nom: '{{ states(''input_text.bose_lib_'' ~ (''%02d'' % (states(''input_text.bose_touche_1'')
          | int(0))) ~ ''_nom'') if (states(''input_text.bose_touche_1'') | int(0))
          > 0 else '''' }}'
    - condition: template
      value_template: '{{ url is string and (url.startswith(''http://'') or url.startswith(''https://''))
        and ''.m3u8'' not in (url | lower) and url not in [''unknown'', ''unavailable'', ''none'', ''''] }}'
    - action: shell_command.bose_relay_prepare
      data:
        url: '{{ url | base64_encode }}'
      response_variable: prepared
    - variables:
        play_url: '{{ prepared.stdout | trim }}'
    - condition: template
      value_template: '{{ play_url.startswith(''http://'') and ''.m3u8'' not in (play_url | lower) }}'
    - action: input_text.set_value
      target:
        entity_id: input_text.bose_ecoute
      data:
        value: '{{ ''https'' if url.startswith(''https://'') else ''http'' }}'
    - if:
      - condition: template
        value_template: '{{ states(cible) in [''off'', ''idle'', ''standby''] }}'
      then:
      - action: media_player.turn_on
        target:
          entity_id: '{{ cible }}'
      - delay:
          seconds: 2
    - action: soundtouchplus.play_url_dlna
      data:
        entity_id: '{{ cible }}'
        url: '{{ play_url }}'
        artist: '{{ nom }}'
        album: Radio
        track: '{{ nom }}'
        update_now_playing_status: true
